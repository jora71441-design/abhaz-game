<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abhaz Band 16-Bit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Press Start 2P', monospace; }
        body { background: #000; color: #fff; text-align: center; }
        #game-container { width: 100%; max-width: 480px; margin: 0 auto; background: #050505; min-height: 100vh; position: relative; overflow: hidden; display: flex; flex-direction: column; border-left: 2px solid #222; border-right: 2px solid #222; }
        .screen { display: none; padding: 20px; flex-direction: column; justify-content: center; min-height: 100vh; }
        .active { display: flex; }
        
        /* Брендовая триколор-полоса */
        .brand-stripe { height: 6px; width: 100%; display: flex; margin: 15px 0; }
        .stripe-red { background: #E30613; flex: 1; }
        .stripe-white { background: #FFFFFF; flex: 1; }
        .stripe-green { background: #00A859; flex: 1; }

        h1 { color: #fff; font-size: 16px; margin-bottom: 10px; letter-spacing: 2px; line-height: 1.4; text-transform: uppercase; }
        p, label { font-size: 8px; line-height: 1.6; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn { background: #fff; color: #000; border: none; padding: 16px; font-size: 10px; margin-top: 15px; cursor: pointer; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; box-shadow: 0 4px #444; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #444; }
        
        input, select { padding: 12px; margin: 8px 0 16px 0; background: #111; color: #00A859; border: 2px solid #00A859; font-size: 10px; width: 100%; text-align: center; outline: none; }
        
        /* Canvas & HUD */
        #canvas-wrap { position: relative; width: 100%; height: 240px; background: #000; border-top: 3px solid #fff; border-bottom: 3px solid #fff; }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        #hud { display: flex; justify-content: space-between; background: #000; padding: 12px 10px; font-size: 8px; color: #fff; border-bottom: 1px solid #222; }
        #hud span { color: #00A859; }
        #controls { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: #050505; }
        .ctrl-btn { background: #111; color: #fff; border: 2px solid #fff; padding: 18px 5px; font-size: 8px; cursor: pointer; text-transform: uppercase; }
        .ctrl-btn:active { background: #fff; color: #000; }
        #btn-gel { border-color: #E30613; color: #E30613; }
        #btn-gel:active { background: #E30613; color: #fff; }

        /* Пиксельная ладонь */
        .hand-logo { font-size: 24px; margin-bottom: 10px; line-height: 1; color: #fff; }
    </style>
</head>
<body>

<div id="game-container">

    <!-- ШАГ 0: АНТРОПОМЕТРИЯ -->
    <div id="screen-profile" class="screen active">
        <div class="hand-logo">&#10025; &#10025; &#9995; &#10025; &#10025;</div>
        <h1>ABHAZ BAND</h1>
        <div class="brand-stripe">
            <div class="stripe-red"></div>
            <div class="stripe-white"></div>
            <div class="stripe-green"></div>
        </div>
        <p>ПРОФИЛЬ РАЙДЕРА</p>
        <label>РОСТ (СМ):</label>
        <input type="number" id="input-height" value="180">
        <label>ВЕС (КГ):</label>
        <input type="number" id="input-weight" value="75">
        <button class="btn" onclick="goToBase()">В ГАРАЖ &#8594;</button>
    </div>

    <!-- ШАГ 1: БАЗА -->
    <div id="screen-base" class="screen">
        <h1>ГАРАЖ</h1>
        <div class="brand-stripe">
            <div class="stripe-red"></div>
            <div class="stripe-white"></div>
            <div class="stripe-green"></div>
        </div>
        <p id="profile-summary" style="color: #00A859; margin-bottom: 15px;"></p>
        <label>ВЫБОР БАЙКА:</label>
        <select id="select-bike">
            <option value="road">ШОССЕЙНИК (СКОРОСТЬ +)</option>
            <option value="gravel">ГРАВИЙНИК (КОНТРОЛЬ +)</option>
        </select>
        <label>ЗАПАС ГЕЛЕЙ:</label>
        <select id="select-gels">
            <option value="2">2 ГЕЛЯ (ЛЕГКИЙ ВЕС)</option>
            <option value="4">4 ГЕЛЯ (ЗАПАС)</option>
        </select>
        <button class="btn" onclick="startGame()">НА МАРШРУТ!</button>
    </div>

    <!-- ШАГ 2: 2D ТРАССА -->
    <div id="screen-race" class="screen" style="padding:0; justify-content: flex-start;">
        <div id="hud">
            <div>СКОРОСТЬ: <span id="hud-speed">0</span> КМ/Ч</div>
            <div>ЭНЕРГИЯ: <span id="hud-energy">100</span>%</div>
            <div>ГЕЛИ: <span id="hud-gels">0</span></div>
        </div>
        <div id="canvas-wrap">
            <canvas id="gameCanvas" width="320" height="180"></canvas>
        </div>
        <div id="controls">
            <button class="ctrl-btn" id="btn-pedal">КРУТИ!</button>
            <button class="ctrl-btn" id="btn-gel">СЪЕСТЬ ГЕЛЬ</button>
        </div>
    </div>

    <!-- ШАГ 3: ФИНИШ -->
    <div id="screen-finish" class="screen">
        <h1>ФИНИШ</h1>
        <div class="brand-stripe">
            <div class="stripe-red"></div>
            <div class="stripe-white"></div>
            <div class="stripe-green"></div>
        </div>
        <p id="finish-results" style="line-height: 1.8; color: #fff;"></p>
        <button class="btn" onclick="location.reload()">ЕЩЕ РАЗ</button>
    </div>

</div>

<script>
    let player = { height: 180, weight: 75, bike: 'road', gels: 2, speed: 0, energy: 100, distance: 0 };
    let gameInterval, canvas, ctx;
    let obstacleX = 320;
    let bgOffset = 0;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function goToBase() {
        player.height = parseInt(document.getElementById('input-height').value) || 180;
        player.weight = parseInt(document.getElementById('input-weight').value) || 75;
        let trait = player.weight > 80 ? "МОЩНЯШ" : "ГОРНЯК";
        document.getElementById('profile-summary').innerText = `${player.height}СМ / ${player.weight}КГ [${trait}]`;
        showScreen('screen-base');
    }

    function startGame() {
        player.bike = document.getElementById('select-bike').value;
        player.gels = parseInt(document.getElementById('select-gels').value);
        player.energy = 100; player.speed = 0; player.distance = 0;

        showScreen('screen-race');
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        document.getElementById('btn-pedal').onclick = () => {
            if(player.energy > 3) {
                let accel = player.bike === 'road' ? 3.5 : 2.2;
                player.speed = Math.min(player.speed + accel, 42);
                player.energy -= 1.2;
            }
        };

        document.getElementById('btn-gel').onclick = () => {
            if(player.gels > 0) {
                player.gels--;
                player.energy = Math.min(player.energy + 40, 100);
            }
        };

        obstacleX = 320;
        gameInterval = setInterval(updateGame, 1000 / 30);
    }

    function drawPixelBike(x, y) {
        // Райдер в чёрной форме Abhaz Band с красной полосой
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 6, y - 16, 6, 6); // Шлем
        ctx.fillStyle = '#111111'; ctx.fillRect(x + 4, y - 10, 10, 8); // Чёрное джерси
        ctx.fillStyle = '#E30613'; ctx.fillRect(x + 4, y - 6, 10, 2);  // Красный акцент
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 2, y - 2, 6, 4);   // Велошорты
        
        // Колеса и рама
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x - 2, y + 6, 6, 0, Math.PI * 2); ctx.stroke(); // Заднее колесо
        ctx.beginPath(); ctx.arc(x + 16, y + 6, 6, 0, Math.PI * 2); ctx.stroke(); // Переднее колесо
        ctx.fillStyle = '#00A859'; ctx.fillRect(x + 2, y, 10, 2); // Зелёная рама
    }

    function drawCow(x, y) {
        // Корова на дороге
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, 22, 12);
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(x + 3, y + 2, 5, 5); ctx.fillRect(x + 12, y + 4, 6, 4);
        ctx.fillRect(x + 18, y - 4, 6, 6);
        ctx.fillStyle = '#888888'; ctx.fillRect(x + 2, y + 12, 2, 4); ctx.fillRect(x + 16, y + 12, 2, 4);
    }

    function updateGame() {
        player.speed = Math.max(0, player.speed - 0.5);
        player.energy = Math.max(0, player.energy - (player.speed * 0.025));
        player.distance += player.speed * 0.08;
        bgOffset += player.speed * 0.3;

        // --- РЕНДЕР ТРАССЫ В СТИЛЕ ABHAZ BAND ---
        // Чёрный фон неба
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, 320, 70);

        // Силуэты гор (монохром)
        ctx.fillStyle = '#1a1a1a';
        for(let i=0; i<5; i++) {
            let gx = (i * 90 - (bgOffset * 0.2) % 90);
            ctx.beginPath(); ctx.moveTo(gx, 70); ctx.lineTo(gx+45, 25); ctx.lineTo(gx+90, 70); ctx.fill();
        }

        // Фирменная трехполосица вдоль трассы
        ctx.fillStyle = '#E30613'; ctx.fillRect(0, 70, 320, 3);
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 73, 320, 3);
        ctx.fillStyle = '#00A859'; ctx.fillRect(0, 76, 320, 3);

        // Асфальт
        ctx.fillStyle = '#111111'; ctx.fillRect(0, 79, 320, 101);
        
        // Разметка
        ctx.fillStyle = '#333333';
        for(let rx=0; rx<320; rx+=40) {
            let lineX = (rx - (bgOffset % 40));
            ctx.fillRect(lineX, 130, 20, 2);
        }

        // Объекты
        drawPixelBike(40, 125);
        
        obstacleX -= player.speed * 0.6;
        if(obstacleX < -30) obstacleX = 320 + Math.random() * 180;
        drawCow(obstacleX, 125);

        // HUD
        document.getElementById('hud-speed').innerText = Math.round(player.speed);
        document.getElementById('hud-energy').innerText = Math.round(player.energy);
        document.getElementById('hud-gels').innerText = player.gels;

        if(player.distance >= 250 || (player.energy <= 0 && player.speed === 0)) {
            clearInterval(gameInterval);
            finishGame();
        }
    }

    function finishGame() {
        showScreen('screen-finish');
        let res = document.getElementById('finish-results');
        if(player.distance >= 250) {
            res.innerHTML = `<span style="color:#00A859">ФИНИШ ВЗЯТ!</span><br><br>ДИСТАНЦИЯ ПРОЙДЕНА!<br><br>ПРОМОКОД:<br><b style="color:#fff">ABHAZ_2026</b>`;
        } else {
            res.innerHTML = `<span style="color:#E30613">КАПОТ!</span><br><br>ЗАКОНЧИЛИСЬ СИЛЫ.<br>ВОЗЬМИ БОЛЬШЕ ГЕЛЕЙ!`;
        }
    }
</script>

</body>
</html>
