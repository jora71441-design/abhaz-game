<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abhaz Band 16-Bit Prototype</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #111; color: #fff; font-family: 'Courier New', monospace; text-align: center; }
        #game-container { width: 100%; max-width: 480px; margin: 0 auto; background: #222; min-height: 100vh; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .screen { display: none; padding: 20px; flex-direction: column; justify-content: center; min-height: 100vh; }
        .active { display: flex; }
        h1 { color: #ffcc00; text-shadow: 2px 2px #ff0000; font-size: 24px; margin-bottom: 15px; }
        .btn { background: #ffcc00; color: #000; border: 4px solid #fff; padding: 12px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; text-transform: uppercase; }
        .btn:active { background: #ff9900; }
        input, select { padding: 10px; margin: 8px 0; background: #000; color: #0f0; border: 2px solid #0f0; font-family: monospace; font-size: 16px; width: 100%; }
        
        /* Canvas & HUD */
        #canvas-wrap { position: relative; width: 100%; height: 260px; background: #000; }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        #hud { display: flex; justify-content: space-between; background: #333; padding: 8px; font-size: 12px; color: #0f0; border-bottom: 2px solid #555; }
        #controls { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ctrl-btn { background: #444; color: #fff; border: 2px solid #888; padding: 20px; font-size: 14px; font-weight: bold; }
        .ctrl-btn:active { background: #666; }
    </style>
</head>
<body>

<div id="game-container">

    <!-- ШАГ 0: АНТРОПОМЕТРИЯ -->
    <div id="screen-profile" class="screen active">
        <h1>ABHAZ BAND 16-BIT</h1>
        <p>Создай профиль райдера:</p>
        <label>Рост (см):</label>
        <input type="number" id="input-height" value="180">
        <label>Вес (кг):</label>
        <input type="number" id="input-weight" value="75">
        <button class="btn" onclick="goToBase()">Далее в Гараж</button>
    </div>

    <!-- ШАГ 1: БАЗА / СЕПАП -->
    <div id="screen-base" class="screen">
        <h1>ГАРАЖ (ЭТАП 1)</h1>
        <p id="profile-summary" style="color: #0f0; margin-bottom: 10px;"></p>
        <label>Выбор Байка:</label>
        <select id="select-bike">
            <option value="road">Шоссейник (Скорость +)</option>
            <option value="gravel">Гравийник (Контроль +)</option>
        </select>
        <label>Запас Гелей:</label>
        <select id="select-gels">
            <option value="2">2 Геля (Легкий вес)</option>
            <option value="4">4 Геля (Запас энергии)</option>
        </select>
        <button class="btn" onclick="startGame()">На Маршрут!</button>
    </div>

    <!-- ШАГ 2: 2D ТРАССА -->
    <div id="screen-race" class="screen" style="padding:0; justify-content: flex-start;">
        <div id="hud">
            <div>СПРИНТ: <span id="hud-speed">0</span> км/ч</div>
            <div>ЭНЕРГИЯ: <span id="hud-energy">100</span>%</div>
            <div>ГЕЛИ: <span id="hud-gels">0</span></div>
        </div>
        <div id="canvas-wrap">
            <canvas id="gameCanvas" width="320" height="180"></canvas>
        </div>
        <div id="controls">
            <button class="ctrl-btn" id="btn-pedal">КРУТИТЬ (TAP)</button>
            <button class="ctrl-btn" id="btn-gel" style="background: #a00;">СЪЕСТЬ ГЕЛЬ</button>
        </div>
    </div>

    <!-- ШАГ 3: ФИНИШ -->
    <div id="screen-finish" class="screen">
        <h1>ФИНИШ ДНЯ!</h1>
        <p id="finish-results" style="line-height: 1.6;"></p>
        <button class="btn" onclick="location.reload()">Заново</button>
    </div>

</div>

<script>
    // Игровые переменные
    let player = { height: 180, weight: 75, bike: 'road', gels: 2, speed: 0, energy: 100, distance: 0 };
    let gameInterval, canvas, ctx;
    let obstacleX = 320;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function goToBase() {
        player.height = parseInt(document.getElementById('input-height').value) || 180;
        player.weight = parseInt(document.getElementById('input-weight').value) || 75;
        
        let trait = player.weight > 80 ? "Мощняш (Спуск +)" : "Горняк (Подъем +)";
        document.getElementById('profile-summary').innerText = `Профиль: ${player.height}см / ${player.weight}кг [${trait}]`;
        showScreen('screen-base');
    }

    function startGame() {
        player.bike = document.getElementById('select-bike').value;
        player.gels = parseInt(document.getElementById('select-gels').value);
        player.energy = 100;
        player.speed = 0;
        player.distance = 0;

        showScreen('screen-race');
        
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        
        // Настройка кнопок
        document.getElementById('btn-pedal').onclick = () => {
            if(player.energy > 5) {
                let accel = player.bike === 'road' ? 4 : 2.5;
                player.speed = Math.min(player.speed + accel, 45);
                player.energy -= 1.5;
            }
        };

        document.getElementById('btn-gel').onclick = () => {
            if(player.gels > 0) {
                player.gels--;
                player.energy = Math.min(player.energy + 35, 100);
            }
        };

        // Главный цикл
        obstacleX = 320;
        gameInterval = setInterval(updateGame, 50);
    }

    function updateGame() {
        // Падение скорости и расход энергии от веса
        player.speed = Math.max(0, player.speed - 0.8);
        player.energy = Math.max(0, player.energy - (player.speed * 0.03));
        player.distance += player.speed * 0.1;

        // Движение препятствия (Корова на дороге)
        obstacleX -= player.speed * 0.5;
        if(obstacleX < -30) obstacleX = 320 + Math.random() * 200;

        // Отрисовка Pixel Art
        ctx.fillStyle = '#4b6584'; ctx.fillRect(0, 0, 320, 100); // Небо
        ctx.fillStyle = '#2bcbba'; ctx.fillRect(0, 70, 320, 30);  // Горы/Задник
        ctx.fillStyle = '#778ca3'; ctx.fillRect(0, 100, 320, 80); // Дорога

        // Игрок (Велосипедист)
        ctx.fillStyle = '#ff5252'; 
        ctx.fillRect(40, 130 - (player.height > 185 ? 5 : 0), 20, 20); // Тело
        ctx.fillStyle = '#fff';
        ctx.fillRect(45, 145, 10, 10); // Колеса

        // Препятствие (Корова)
        ctx.fillStyle = '#000';
        ctx.fillRect(obstacleX, 135, 25, 15);

        // Обновление HUD
        document.getElementById('hud-speed').innerText = Math.round(player.speed);
        document.getElementById('hud-energy').innerText = Math.round(player.energy);
        document.getElementById('hud-gels').innerText = player.gels;

        // Проверка финиша или полной остановки без энергии
        if(player.distance >= 300 || (player.energy <= 0 && player.speed === 0)) {
            clearInterval(gameInterval);
            finishGame();
        }
    }

    function finishGame() {
        showScreen('screen-finish');
        let res = document.getElementById('finish-results');
        if(player.distance >= 300) {
            res.innerHTML = `<span style="color:#0f0">УСПЕХ!</span><br>Дистанция пройдена!<br>Промокод за прохождение: <b>ABHAZ_PROMO_2026</b>`;
        } else {
            res.innerHTML = `<span style="color:#f00">ГОЛОДНЫЙ ОБМОРОК!</span><br>Закончилась энергия.<br>Возьми больше гелей на Базе!`;
        }
    }
</script>

</body>
</html>
